---
# Deployment — 滚动更新 + 健康检查
# MySQL 模式（DB_ENGINE=mysql）：多副本安全，可水平扩展
# SQLite 模式（DB_ENGINE=sqlite）：必须 replicas: 1 + PVC 挂载
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lanqi-svc-params
  labels:
    app: lanqi-svc-params
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lanqi-svc-params
  template:
    metadata:
      labels:
        app: lanqi-svc-params
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: lanqi-svc-params
          # ⚠️ 部署前替换为你的镜像仓库地址 + 版本 tag（勿用 latest 上生产）
          image: lanqi-svc-params:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lanqi-svc-params-config
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: DB_PASS
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: DB_NAME
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: SECRET_KEY
            - name: PWD_SALT
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: PWD_SALT
            - name: CRED_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: CRED_SECRET_KEY
            # LDAP Bind 密码（敏感，放 Secret）
            - name: LDAP_BIND_PASS
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: LDAP_BIND_PASS
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /login
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/modules
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
