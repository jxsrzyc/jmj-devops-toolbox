---
# Deployment — 滚动更新 + 健康检查
# ⚠️ SQLite 模式必须 replicas: 1（SQLite 文件不支持多副本并发写）
#   如需多副本高可用，请迁移到 MySQL（DB_ENGINE=mysql + Secret 中 DB_* 配置）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lanqi-svc-params
  labels:
    app: lanqi-svc-params
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lanqi-svc-params
  template:
    metadata:
      labels:
        app: lanqi-svc-params
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: lanqi-svc-params
          # ⚠️ 部署前替换为你的镜像仓库地址 + 版本 tag（勿用 latest 上生产）
          image: lanqi-svc-params:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lanqi-svc-params-config
          env:
            # 生产密钥来自 Secret（覆盖 ConfigMap / 内置默认值）
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: SECRET_KEY
            - name: PWD_SALT
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: PWD_SALT
            - name: CRED_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lanqi-svc-params-secret
                  key: CRED_SECRET_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /login
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/modules
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lanqi-svc-params-pvc
