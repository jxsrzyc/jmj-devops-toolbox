---
# Deployment — 部署 2 个副本，滚动更新
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lanqi-svc-params
  labels:
    app: lanqi-svc-params
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lanqi-svc-params
  template:
    metadata:
      labels:
        app: lanqi-svc-params
    spec:
      containers:
        - name: lanqi-svc-params
          image: lanqi-svc-params:latest    # 替换为你的镜像仓库地址
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lanqi-svc-params-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/modules
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/modules
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lanqi-svc-params-pvc
