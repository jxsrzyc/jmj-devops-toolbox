---
# Secret — 生产密钥与数据库连接（⚠️ 部署前必须填写真实值！）
# ⚠️⚠️ 三个"必须与本地一致"的密钥，否则功能异常：
#   1. CRED_SECRET_KEY：必须 = 本地 .env 的 CRED_SECRET_KEY（凭证用此密钥加密，不同则服务凭证无法解密）
#   2. PWD_SALT：本地 .env 未配置时保持默认（不设置即用内置 "lanqi-svc-params-2026"）。
#      若部署环境设置了不同的值，users 表已有密码 hash 将无法通过验证（admin 无法登录）
#   3. SECRET_KEY：可自定义（仅影响 session，不影响登录）
# 生成随机值（若需）：openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: lanqi-svc-params-secret
  labels:
    app: lanqi-svc-params
type: Opaque
stringData:
  # ① 服务凭证加密密钥 —— 复制本地 .env 的 CRED_SECRET_KEY 值（必填，凭证解密依赖）
  CRED_SECRET_KEY: "REPLACE_WITH_LOCAL_CRED_SECRET_KEY"
  # ② 密码加盐 —— 与本地一致（本地未自定义就留空/删除本行，使用内置默认）
  PWD_SALT: ""
  # ③ Session 密钥 —— 可自定义（openssl rand -hex 32）
  SECRET_KEY: "REPLACE_WITH_RANDOM_HEX_32"
  # ④ MySQL 连接（DB_ENGINE=mysql 时生效，填生产库真实信息）
  DB_HOST: "mysql-dev-001.datousoft.com"
  DB_PORT: "3306"
  DB_USER: "ops_toolbox"
  DB_PASS: "REPLACE_WITH_MYSQL_PASSWORD"
  DB_NAME: "ops_toolbox"
  # ⑤ LDAP Bind 服务账号密码（LDAP_ENABLE=true 且非匿名搜索时必填）
  LDAP_BIND_PASS: "REPLACE_WITH_LDAP_BIND_PASSWORD"
