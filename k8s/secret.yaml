---
# Secret — 生产密钥（⚠️ 部署前必须替换为随机值！）
# 生成方式：
#   SECRET_KEY:      openssl rand -hex 32
#   PWD_SALT:        openssl rand -hex 16
#   CRED_SECRET_KEY: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# 注意：CRED_SECRET_KEY 一旦用于加密服务凭证，更换后旧凭证将无法解密（需重新录入）
apiVersion: v1
kind: Secret
metadata:
  name: lanqi-svc-params-secret
  labels:
    app: lanqi-svc-params
type: Opaque
stringData:
  SECRET_KEY: "change-me-random-hex-32-bytes"
  PWD_SALT: "change-me-random-hex-16-bytes"
  CRED_SECRET_KEY: "change-me-fernet-key-base64-44-chars"
  # ---- MySQL 模式时取消注释并填写（DB_ENGINE=mysql）----
  # DB_HOST: "mysql-dev-001.example.com"
  # DB_PORT: "3306"
  # DB_USER: "ops_toolbox"
  # DB_PASS: "your-mysql-password"
  # DB_NAME: "ops_toolbox"
