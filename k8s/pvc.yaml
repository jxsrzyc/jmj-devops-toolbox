---
# PersistentVolumeClaim — SQLite 数据持久化
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lanqi-svc-params-pvc
  labels:
    app: lanqi-svc-params
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi           # SQLite 文件很小，1Gi 足够
  # storageClassName: ""     # 如需指定 StorageClass，取消注释并填入名称
