---
# Service — 集群内部访问 + 可选 Ingress
apiVersion: v1
kind: Service
metadata:
  name: lanqi-svc-params
  labels:
    app: lanqi-svc-params
spec:
  type: ClusterIP
  selector:
    app: lanqi-svc-params
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
      name: http
---
# 可选: 如需外部 LoadBalancer 访问，取消下面注释
