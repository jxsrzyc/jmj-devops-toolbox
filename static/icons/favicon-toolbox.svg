<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#1d5fd1"/>
    </linearGradient>
    <linearGradient id="wrench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- 齿轮（大） -->
  <g transform="translate(256,235)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <circle r="88" stroke-width="30"/>
    <circle r="88" opacity="0.35"/>
    <!-- 齿轮齿 -->
    <g stroke-width="26">
      <line x1="0" y1="-118" x2="0" y2="-88"/>
      <line x1="118" y1="0" x2="88" y2="0"/>
      <line x1="0" y1="118" x2="0" y2="88"/>
      <line x1="-118" y1="0" x2="-88" y2="0"/>
      <line x1="83" y1="-83" x2="62" y2="-62"/>
      <line x1="83" y1="83" x2="62" y2="62"/>
      <line x1="-83" y1="83" x2="-62" y2="62"/>
      <line x1="-83" y1="-83" x2="-62" y2="-62"/>
    </g>
  </g>
  <!-- 齿轮中心孔 -->
  <circle cx="256" cy="235" r="34" fill="#1d5fd1"/>
  <!-- 扳手 -->
  <g transform="translate(256,235)">
    <!-- 扳手手柄，从齿轮中心向右下方 -->
    <path d="M 28,-6 L 150,128 A 8,8 0 0 1 138,144 L 16,10 Z" fill="url(#wrench)"/>
    <!-- 扳手开口头 -->
    <g transform="translate(158,138) rotate(-25)">
      <path d="M 0,0 L 42,-24 L 56,-8 L 20,14 Z" fill="url(#wrench)"/>
      <circle cx="30" cy="-12" r="7" fill="#1d5fd1"/>
    </g>
  </g>
  <!-- 底部装饰条 -->
  <rect x="120" y="430" width="272" height="14" rx="7" fill="#ffffff" opacity="0.25"/>
</svg>
